{{ template "chrome/head.html" . }}
<body>

  {{ template "chrome/sidebar.html" . }}

  <div class="content container">
  <div class="post">
    <h1 class="post-title">{{ .Title }}</h1>
    {{ if eq .Type "post" }}
    <span class="post-date">{{ .Date.Format "Jan 2, 2006" }}</span>
    {{ end }}

    {{ .Content }}

    {{ if eq .Type "post" }}
    {{ template "partials/comments.html" . }}
    {{ end }}
  </div>
  </div>

</body>
</html>
